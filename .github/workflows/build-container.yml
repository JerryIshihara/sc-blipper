name: Build and publish sc-blipper container

on:
  workflow_dispatch:
  pull_request_target:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/sc-blipper-amd64

jobs:
  configure:
    name: Configure image publication
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.select.outputs.channel }}
      channel_tag: ${{ steps.select.outputs.channel_tag }}
      version_tag: ${{ steps.select.outputs.version_tag }}
      sha_tag: ${{ steps.select.outputs.sha_tag }}

    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.ref || github.ref }}

      - name: Configure tags
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ ! -f VERSION ]]; then
            echo 'The repository root VERSION file is missing.' >&2
            exit 1
          fi

          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "VERSION must contain a base semantic version such as 0.0.5: $version" >&2
            exit 1
          fi
          version="v${BASH_REMATCH[1]}"

          if [[ "$EVENT_NAME" == 'pull_request_target' ]]; then
            channel=official
            channel_tag=latest
            prerelease=
            sha_suffix=
          elif [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            channel=beta
            channel_tag=beta
            prerelease="beta.$RUN_NUMBER"
            sha_suffix=-beta
          else
            echo "Unsupported publication source: $EVENT_NAME on $REF_NAME" >&2
            exit 1
          fi

          if [[ -n "$prerelease" ]]; then
            version_tag="$version-$prerelease"
          else
            version_tag="$version"
          fi

          {
            echo "channel=$channel"
            echo "channel_tag=$channel_tag"
            echo "version_tag=$version_tag"
            echo "sha_tag=sha-$GITHUB_SHA$sha_suffix"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build linux/amd64 image
    needs: configure
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.configure.outputs.channel_tag }}
            type=raw,value=${{ needs.configure.outputs.version_tag }}
            type=raw,value=${{ needs.configure.outputs.sha_tag }}

      - name: Build and push linux/amd64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/sc-blipper/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=sc-blipper-amd64
          cache-to: type=gha,mode=max,scope=sc-blipper-amd64
          provenance: mode=max
          sbom: true

      - name: Write publication summary
        env:
          PUBLISHED_CHANNEL: ${{ needs.configure.outputs.channel }}
          PUBLISHED_TAGS: ${{ steps.meta.outputs.tags }}
          PUBLISHED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Published container'
            echo
            echo "Platform: \`linux/amd64\`"
            echo "Channel: \`$PUBLISHED_CHANNEL\`"
            echo
            echo '```text'
            echo "$PUBLISHED_TAGS"
            echo '```'
            echo
            echo "Digest: \`$PUBLISHED_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
